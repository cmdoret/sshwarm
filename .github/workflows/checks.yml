---
name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency: # a new push supersedes the run of the previous one
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # Only fail and print the diff
      - name: Check formatting
        run: |
          nix develop .#ci --command just check-format ||
            { git diff; exit 1; }

      - name: Lint
        run: nix develop .#ci --command just lint

      - name: Test
        run: nix develop .#ci --command just go::test -race -cover

      - name: Check for known vulnerabilities
        run: nix develop .#ci --command just go::vuln

      # As users get it: the tests again, in Nix's sandbox, and the vendorHash.
      - name: Build
        run: nix develop .#ci --command just build
