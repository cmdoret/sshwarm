# Plain treefmt config: `just format`. The Nix dev shells ship the formatters.

# gofumpt and goimports, as .golangci.yml sets them up.
[formatter.golangci-lint]
command = "golangci-lint"
options = ["fmt"]
includes = ["*.go"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.shfmt]
command = "shfmt"
options = ["-w", "-i", "2"]
includes = ["*.sh"]
