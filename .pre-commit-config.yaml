# Git hooks, run by prek (`just setup`) with the tools of the Nix dev shell.
repos:
  - repo: local
    hooks:
      - id: format
        name: Format files.
        entry: just check-format
        language: system
        pass_filenames: true
      - id: lint
        name: Lint code.
        entry: just lint
        language: system
        pass_filenames: false
