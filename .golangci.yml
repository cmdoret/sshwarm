# golangci-lint v2: `just lint`, and `just format` through treefmt.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - contextcheck
    - errorlint
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - revive
    - unparam
    - usestdlibvars

  settings:
    errcheck:
      exclude-functions:
        - (*io.PipeReader).Close # always nil
        - (*io.PipeWriter).Close

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/cmdoret/sshwarm
